name: Terraform Security Scan

# IaC misconfiguration scanning with Trivy, scoped to the environment being
# deployed (plus shared modules). Fails the stage when findings are detected.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Terraform environment folder being deployed (dev/qa)'
        required: true
        type: string
        default: dev
      severity:
        description: 'Comma-separated severities that should fail the stage'
        required: false
        type: string
        default: 'CRITICAL,HIGH'

permissions:
  contents: read

jobs:
  scan:
    name: Trivy IaC scan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy IaC scan (environment)
        # Scans the target environment as a composed root module. Trivy follows
        # every module call, so key-vault/function-app/service-bus/etc. are all
        # evaluated here and rolled up under the environment target.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: environments/${{ inputs.environment }}
          severity: ${{ inputs.severity }}
          exit-code: '1' # fail the stage when any matching finding is detected
          format: table
          hide-progress: true

      - name: Run Trivy IaC scan (all modules)
        # Scans each module folder as its own target so every module appears on
        # its own row in the report — making coverage explicit for reviewers,
        # even for modules not yet wired into an environment.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: modules
          severity: ${{ inputs.severity }}
          exit-code: '1' # fail the stage when any matching finding is detected
          format: table
          hide-progress: true


